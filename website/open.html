<section class="hero"><h1>افتحي في تطبيق منيتي</h1><p>هذا الرابط يُفتح داخل التطبيق.</p>
<a class="btn" id="open" href="#">فتح في التطبيق</a> <a class="btn alt store-link" href="#">حمّلي التطبيق</a></section>
</div>
<script>
  const p = location.pathname.replace(/^\/+|\/+$/g, "");
  const ok = /^(p|s|store|c|b)\/[A-Za-z0-9_-]{1,64}$|^plans$/.test(p);
  document.getElementById("open").href = ok ? `munyati://${p}` : "/";
  document.querySelectorAll(".store-link").forEach(a => { const u = window.MUNYATI.appStoreUrl; if (u) a.href = u; else a.textContent = "قريباً على App Store"; });
</script>
